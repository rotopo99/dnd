<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Руслания Лайт</title>
  <!-- heading font (docs/STYLE.md «Шрифт»): Russo One, OFL; offline -> system sans fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" media="print" onload="this.media='all'">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14141c; }
    body { display: grid; place-items: center; }
    canvas { image-rendering: pixelated; display: block; grid-area: 1 / 1; }
    #gl, #gl3 { image-rendering: auto; pointer-events: none; visibility: hidden; }
    #game { position: relative; z-index: 1; } /* #gl3's clip-path makes a stacking context: keep the 2D UI on top */
  </style>
</head>
<body>
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="gl3" width="1280" height="720"></canvas>
  <canvas id="game" width="1280" height="720"></canvas>
  <!-- vendor ES modules (game/vendor/README.md): relative paths, works from any static host / sub-folder -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/", "@pixiv/three-vrm": "./vendor/three-vrm/three-vrm.module.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
