<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Руслания Лайт</title>
  <!-- heading font (docs/STYLE.md «Шрифт»): Russo One, OFL; offline -> system sans fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" media="print" onload="this.media='all'">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14141c; }
    body { display: grid; place-items: center; }
    canvas { image-rendering: pixelated; display: block; grid-area: 1 / 1; }
    #gl { image-rendering: auto; pointer-events: none; visibility: hidden; }
  </style>
</head>
<body>
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="game" width="1280" height="720"></canvas>
  <script type="module" src="./src/main.js"></script>
