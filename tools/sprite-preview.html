<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Sprite preview</title>
  <style>
    body { margin: 0; background: #14141c; color: #dfe3e8; font: 12px monospace; }
    canvas { image-rendering: pixelated; display: block; }
    #errors { color: #c42828; padding: 4px 8px; white-space: pre; }
  </style>
</head>
<body>
  <div id="errors"></div>
  <canvas id="c"></canvas>
  <script type="module">
    import {
      SPRITES, PALETTE, PALETTE_KEYS, RACE_IDS, CLASS_IDS, ENEMY_IDS, SUMMON_IDS, NPC_IDS, WORLD_ENEMY_IDS, MAP_ICON_IDS, TILE,
      drawPortrait, drawHeroPortrait, validatePortraits, drawMapIcon,
      drawSprite, drawTeamMarker, heroSpriteIds, enemySpriteIds, tileSpriteIds, validateSprites,
    } from '../game/src/assets/sprites.js';
    import { NPCS, recruitables } from '../game/src/data/npcs.js';

    const S = 3;
    const CELL = TILE * S;            // 48
    const PAD = 14;                   // label height
    const COLW = CELL + 30;
    const errs = validateSprites();
    document.getElementById('errors').textContent = errs.length ? errs.join('\n') : '';

    const canvas = document.getElementById('c');
    canvas.width = 1240;
    canvas.height = 4200;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#14141c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textBaseline = 'top';

    let y = 8;
    const title = (t) => { ctx.fillStyle = '#f0b050'; ctx.font = 'bold 14px monospace'; ctx.fillText(t, 8, y); y += 22; ctx.font = '11px monospace'; };
    const label = (t, x, yy) => { ctx.fillStyle = '#8d95a8'; ctx.fillText(t, x, yy); };
    const floorUnder = (x, yy, col, row) => drawSprite(ctx, tileSpriteIds('.', col, row), x, yy, S);

    // Palette
    title('Palette');
    PALETTE.forEach((hex, i) => {
      const x = 8 + i * 46;
      ctx.fillStyle = hex; ctx.fillRect(x, y, 40, 24);
      label(`${PALETTE_KEYS[i]} ${hex.slice(1)}`, x - 2, y + 27);
    });
    y += 50;

    // Tiles
    title('Tiles (grid chars # . c ~ D) + variations');
    const tiles = ['tile-floor', 'tile-floor-split', 'tile-floor-rust', 'tile-floor-grate', 'tile-wall', 'tile-wall-pipe', 'tile-door',
      ['tile-floor', 'obj-crate'], ['tile-floor', 'obj-barricade'], ['tile-floor', 'obj-scorch', 'obj-fire']];
    tiles.forEach((t, i) => {
      const x = 8 + i * (CELL + 50);
      drawSprite(ctx, t, x, y, S);
      if (Array.isArray(t) && t.includes('obj-fire')) drawSprite(ctx, t, x + CELL + 2, y, S, { frame: 1 });
      label(Array.isArray(t) ? t[t.length - 1] : t, x, y + CELL + 3);
    });
    y += CELL + PAD + 16;

    // Sample map
    title('Sample map');
    const map = [
      '##############',
      '#P...c....~~.#',
      '#..#.....E...D',
      '#.P..cc...~..#',
      '#....#..E..c.#',
      '##############',
    ];
    const mapY = y;
    map.forEach((line, r) => [...line].forEach((ch, cIdx) => drawSprite(ctx, tileSpriteIds(ch, cIdx, r), 8 + cIdx * CELL, mapY + r * CELL, S)));
    const put = (ids, col, row, team, opts = {}) => {
      const x = 8 + col * CELL, yy = mapY + row * CELL;
      drawTeamMarker(ctx, team, x, yy, S);
      drawSprite(ctx, ids, x, yy, S, opts);
    };
    put(heroSpriteIds('human', 'ranger'), 1, 1, 'player');
    put(heroSpriteIds('skeleton', 'zabivnoy'), 2, 3, 'player');
    put(heroSpriteIds('android', 'itishnik'), 3, 2, 'player', { tint: 'h' });
    put(enemySpriteIds('cultist'), 9, 2, 'enemy', { flip: true });
    put(enemySpriteIds('junk-mech'), 8, 4, 'enemy', { flip: true });
    put(enemySpriteIds('acolyte'), 12, 3, 'enemy', { flip: true });
    put(enemySpriteIds('drone'), 4, 4, 'ally');
    put(enemySpriteIds('npc-gans'), 6, 4, 'ally');
    y += map.length * CELL + 12;

    // Heroes: race x class matrix
    title('Heroes: race (rows) x class (columns), frame 0');
    const gx = 110;
    label('body', gx, y);
    CLASS_IDS.forEach((c, i) => label(c, gx + (i + 1) * COLW, y));
    y += PAD;
    RACE_IDS.forEach((r, ri) => {
      label(r, 8, y + 18);
      drawSprite(ctx, 'tile-floor', gx, y, S);
      drawSprite(ctx, heroSpriteIds(r), gx, y, S);
      CLASS_IDS.forEach((c, ci) => {
        const x = gx + (ci + 1) * COLW;
        floorUnder(x, y, ci, ri);
        drawSprite(ctx, heroSpriteIds(r, c), x, y, S);
      });
      y += CELL + 6;
    });
    y += 10;

    // Idle frames
    title('Idle frames 0 / 1 (heroes)');
    RACE_IDS.forEach((r, i) => {
      const x = 8 + i * (CELL * 2 + 24);
      drawSprite(ctx, heroSpriteIds(r, CLASS_IDS[i]), x, y, S, { frame: 0 });
      drawSprite(ctx, heroSpriteIds(r, CLASS_IDS[i]), x + CELL, y, S, { frame: 1 });
      label(r, x, y + CELL + 3);
    });
    y += CELL + PAD + 16;

    // Enemies & summons (two frames each)
    const mobRow = (ids, name) => {
      title(name);
      const top = y + 24; // room for 24-high sprites
      ids.forEach((id, i) => {
        const x = 8 + i * (CELL * 2 + 4 + 10);
        drawSprite(ctx, 'tile-floor', x, top, S);
        drawSprite(ctx, 'tile-floor', x + CELL, top, S);
        drawSprite(ctx, enemySpriteIds(id), x, top, S, { frame: 0 });
        drawSprite(ctx, enemySpriteIds(id), x + CELL, top, S, { frame: 1 });
        label(id, x, top + CELL + 3);
      });
      y = top + CELL + PAD + 16;
    };
    mobRow(ENEMY_IDS, 'Enemies (frame 0 / 1)');
    mobRow(SUMMON_IDS, 'Summons (frame 0 / 1)');
    mobRow(NPC_IDS, 'NPC allies (frame 0 / 1)');
    // v2 world enemies, 7 per row
    for (let i = 0; i < WORLD_ENEMY_IDS.length; i += 7) mobRow(WORLD_ENEMY_IDS.slice(i, i + 7), i ? 'World enemies (cont.)' : 'World enemies v2 (frame 0 / 1)');

    // Portraits v2 (48x48, native)
    window.__pY = y;
    const RACES4 = [['human', 'technikums'], ['skeleton', 'none'], ['android', 'mechanids'], ['mutant-beast', 'mutantsBeast'], ['mutant-plant', 'mutantsPlant'], ['cringegon', 'cringegons'], ['tekhonok', 'tekhonki'], ['skrilet', 'none']];
    const fake = (race, faction, id) => ({ id: id ?? `t-${race}`, race, faction });
    const PX = 50;
    title('Portraits 48x48: 8 emotions x 8 races');
    ['neutral', 'happy', 'angry', 'sad', 'scared', 'smug', 'surprised', 'cringe'].forEach((emo, i) => {
      RACES4.forEach(([r, f], j) => drawPortrait(ctx, fake(r, f, `emo-${r}`), 8 + i * PX, y + j * PX, 1, { native: true, emotion: emo, frame: 1, blink: false }));
      label(emo.slice(0, 7), 8 + i * PX, y + RACES4.length * PX);
    });
    ctx.fillStyle = '#8d95a8';
    // hp rows to the right
    [1, 0.65, 0.35, 0.1].forEach((hp, i) => {
      RACES4.forEach(([r, f], j) => drawPortrait(ctx, fake(r, f, `emo-${r}`), 430 + i * PX, y + j * PX, 1, { native: true, hp, frame: 1, blink: false, emotion: i > 1 ? 'sad' : 'neutral' }));
      label(`hp ${hp}`, 430 + i * PX, y + RACES4.length * PX);
    });
    [0.2].forEach((mrl) => RACES4.forEach(([r, f], j) => drawPortrait(ctx, fake(r, f, `emo-${r}`), 640, y + j * PX, 1, { native: true, mrl, frame: 1, blink: false })));
    label('mrl 0.2', 640, y + RACES4.length * PX);
    // accessories
    const ACCS = ['glasses', 'shades', 'goggles', 'patch', 'cybereye', 'respirator', 'gp5', 'scarf', 'cig', 'pipe', 'bandage', 'bandana', 'cap', 'vosmiklinka', 'hood', 'helmet', 'headset', 'earbuds', 'earring', 'chain', 'halo', 'headlamp', 'plaster', 'scar-seam', 'ushanka', 'kabuto', 'crown', 'medals'];
    const AX = 700;
    ACCS.forEach((a, i) => { const x = AX + (i % 7) * PX, yy = y + Math.floor(i / 7) * (PX + 10); drawPortrait(ctx, fake('human', 'none', 'acc-demo'), x, yy, 1, { native: true, frame: 1, blink: false, accessories: [a], emotion: i % 3 ? 'neutral' : 'smug' }); label(a.slice(0, 8), x, yy + PX); });
    y += RACES4.length * PX + 20;
    title('Portraits: 12 key NPCs, x2 (96 px)');
    ['lox', 'seer', 'glava-musora', 'galina', 'marta', 'burevestnik', 'khan', 'zver', 'aunt-loza', 'cringe-jester', 'aztun', 'paracetamol'].forEach((id, i) => {
      const x = 8 + (i % 10) * 100, yy = y + Math.floor(i / 10) * 112; drawPortrait(ctx, id, x, yy, 2, { native: true, frame: 1, blink: false }); label(id.slice(0, 13), x, yy + 98); });
    y += 230;
    title('Hero portraits (class accessory) + generated NPCs');
    ['zabivnoy', 'technomant', 'itishnik', 'arbiter', 'ugolovnik', 'ecolog', 'reper', 'slavotech', 'cybertech', 'ranger'].forEach((cls, i) => drawHeroPortrait(ctx, { race: 'human', cls, look: null, name: 'h' + i, sex: i % 2 ? 'f' : 'm' }, 8 + i * PX, y, 1, { native: true, frame: 1, blink: false }));
    Object.values(NPCS).filter((n) => !n.key && !n.recruitable).slice(0, 14).forEach((n, i) => drawPortrait(ctx, n.id, 8 + i * PX, y + PX + 6, 1, { native: true, frame: 1, blink: false }));
    y += 2 * PX + 20;
    const perr = validatePortraits(); if (perr.length) document.getElementById('errors').textContent += '\n' + perr.slice(0, 10).join('\n');
    window.__pEnd = y;

    y += 96 + 12;

    // Map icons
    title('Map icons 16x16 at x3');
    MAP_ICON_IDS.forEach((id, i) => {
      const x = 8 + i * (CELL + 20);
      drawMapIcon(ctx, id, x, y, S);
      label(id.replace('region-', 'r-').replace('terminal-', 't-'), x, y + CELL + 3);
    });
    y += CELL + PAD + 16;

    // Team markers / tint / flash
    title('Team markers, tint (outline) and mono (hit flash)');
    const demo = [['player', {}], ['enemy', {}], ['ally', {}], ['player', { tint: 'h' }], ['enemy', { tint: 'c' }], ['enemy', { mono: '5' }], ['player', { flip: true }]];
    const names = ['player', 'enemy', 'ally', 'tint h', 'tint c', 'mono 5', 'flip'];
    demo.forEach(([team, opts], i) => {
      const x = 8 + i * (CELL + 40);
      drawSprite(ctx, 'tile-floor', x, y, S);
      drawTeamMarker(ctx, team, x, y, S);
      const ids = team === 'enemy' ? enemySpriteIds('scavenger') : heroSpriteIds('mutant-beast', 'mutant');
      drawSprite(ctx, ids, x, y, S, opts);
      label(names[i], x, y + CELL + 3);
    });
    y += CELL + PAD + 16;

    // Actual size x1 sanity check
    title('x1 / x2 actual size');
    RACE_IDS.forEach((r, i) => drawSprite(ctx, heroSpriteIds(r, CLASS_IDS[i]), 8 + i * 20, y, 1));
    [...ENEMY_IDS, ...SUMMON_IDS].forEach((id, i) => drawSprite(ctx, enemySpriteIds(id), 200 + i * 36, y + 8, 2));
    y += 60;

    window.__previewHeight = y;
    window.__previewDone = true;
  </script>
</body>
</html>
